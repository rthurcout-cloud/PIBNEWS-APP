<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gravações PIBN</title>
<meta name="theme-color" content="#0B1628">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gravações">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* Visual novo (27/09/2026): base escura igual ao Controle de Carros, destaque roxo PIB News, botões próprios */
  :root {
    --bg: #0B1628;
    --surface: #122038;
    --surface-2: #19294A;
    --border: #26395C;
    --text: #EAF1FB;
    --muted: #A9BBD6;
    --accent: #99B9DE;          /* azul PIBN: fundo de botão (texto azul-marinho por cima) */
    --accent-2: #BBD0ED;        /* azul claro PIBN: borda / brilho */
    --accent-text: #BBD0ED;     /* texto azul claro sobre fundo escuro */
    --ink: #0B1628;
    --accent-soft: rgba(153,185,222,.16);
    --rec: #FF4D5E;
    --green: #4FD18B;
    --green-soft: rgba(79,209,139,.14);
    --amber: #F2B04A;
    --amber-soft: rgba(242,176,74,.14);
    --red: #F07167;
    --red-soft: rgba(240,113,103,.14);
    --radius: 18px;
    --disp: 'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif;
    --ease: cubic-bezier(.32,.72,0,1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .ico { width: 18px; height: 18px; flex: 0 0 auto; }
  .ico-s { width: 14px; height: 14px; flex: 0 0 auto; vertical-align: -2px; opacity: .85; }

  /* ---------- Topo ---------- */
  header {
    background: rgba(11,22,40,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px; padding-top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .brand .logo i { width: 12px; height: 12px; border-radius: 99px; background: var(--rec); box-shadow: 0 0 0 4px rgba(255,77,94,.18); }
  .brand small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
  header h1 { font-family: var(--disp); font-size: 20px; font-weight: 700; margin: 0; line-height: 1.15; }
  .sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sync::before { content: ''; width: 8px; height: 8px; border-radius: 99px; background: var(--sync-cor, var(--muted)); }
  .tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface); border: 1px solid var(--border); padding: 5px; border-radius: 16px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
    padding: 0 16px; border-radius: 12px; cursor: pointer; font-family: inherit;
    color: var(--muted); border: 0; background: none; font-size: 14px; font-weight: 500;
    transition: background .18s, color .18s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { background: var(--accent); color: var(--ink); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 16px -8px rgba(153,185,222,.9); }

  /* ---------- Menu de baixo (celular) ---------- */
  .bnav { display: none; }

  main { position: relative; max-width: 1120px; margin: 0 auto; padding: 26px 28px 60px; }

  /* ---------- Botões ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 14px;
    font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: .1px;
    background: var(--accent); color: var(--ink); border: 1px solid var(--accent-2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 20px -10px rgba(153,185,222,.95);
    cursor: pointer; transition: transform .14s var(--ease), filter .18s, box-shadow .18s, background .18s, border-color .18s;
  }
  .btn:hover { filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px -10px rgba(153,185,222,1); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .btn.secondary { background: var(--surface-2); border-color: var(--border); color: var(--text); font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .btn.secondary:hover { border-color: #3A5582; background: #1F3358; filter: none; }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); font-weight: 500; box-shadow: none; }
  .btn.ghost:hover { background: var(--surface-2); filter: none; }
  .btn.danger { background: var(--red-soft); color: var(--red); border-color: rgba(240,113,103,.4); box-shadow: none; }
  .btn.danger:hover { background: rgba(240,113,103,.22); filter: none; }
  .btn.small { min-height: 38px; padding: 0 13px; font-size: 13px; border-radius: 12px; }
  .btn.icon-only { width: 44px; padding: 0; }
  .btn.small.icon-only { width: 38px; }

  /* ---------- Início: calendário ---------- */
  .home-wrap { max-width: 1120px; margin: 0 auto; }
  .cal-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .cal-mes { font-family: var(--disp); font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; min-width: 700px; }
  .cal-head div { text-align: center; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; padding: 2px 0 4px; }
  .cal-cell { min-height: 100px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .cal-cell:hover { border-color: #3A5582; background: #16264A; }
  .cal-cell.vazio { background: none; border: none; cursor: default; }
  .cal-cell.hoje { border-color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-2); }
  .cal-num { font-family: var(--disp); font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .cal-cell.hoje .cal-num { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 99px; background: var(--accent); color: var(--ink); }
  .cal-evs { display: flex; flex-direction: column; gap: 4px; }
  .cal-ev { font-size: 11.5px; line-height: 1.3; padding: 3px 7px; border-radius: 7px; background: var(--accent-soft); color: #DDE8F6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cal-ev:hover { filter: brightness(1.2); }
  .cal-ev.gravada { background: var(--green-soft); color: #C9F2DC; }
  .cal-ev.cancelada { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
  .cal-legenda { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .cal-legenda .pt { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin: 0 3px 0 10px; }
  .cal-legenda .pt.ag { background: var(--accent); } .cal-legenda .pt.gr { background: var(--green); } .cal-legenda .pt.ca { background: #5A606A; }

  /* ---------- Listas ---------- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  input, select, textarea {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 13px; min-height: 44px; border-radius: 12px; font-size: 16px; font-family: inherit;
    transition: border-color .18s, box-shadow .18s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(153,185,222,.22); }
  input::placeholder, textarea::placeholder { color: #6B727C; }
  input[type="date"], input[type="time"] { color-scheme: dark; }
  input[type="search"] { min-width: 220px; flex: 1; max-width: 420px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .num { font-family: var(--disp); font-size: 28px; font-weight: 700; line-height: 1.1; }
  .stat .lbl { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; position: relative; }
  .card.gravacao::before, .card.roteiro::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .card.roteiro.vazio::before { background: var(--border); }
  .card.roteiro.feita::before { background: var(--green); }
  .roteiro-resumo { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .roteiro-resumo b { color: var(--text); font-weight: 600; }
  .roteiro-preview { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 14px; color: #C4C9D0; font-size: 13.5px; white-space: pre-wrap; line-height: 1.6; max-height: 104px; overflow: hidden; }
  .roteiro-meta { color: var(--muted); font-size: 12.5px; margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .roteiro-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .check-feita { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; padding: 8px 12px 8px 10px; border: 1px solid var(--border); border-radius: 12px; }
  .check-feita input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; padding: 0; margin: 0; accent-color: var(--green); background: none; border: none; cursor: pointer; -webkit-appearance: auto; appearance: auto; }
  .card.roteiro.feita .check-feita { color: var(--green); font-weight: 600; border-color: rgba(79,209,139,.4); background: var(--green-soft); }
  .card-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card-head .title { font-family: var(--disp); font-size: 17px; font-weight: 600; }
  .card-head .when { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .card-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .badge { padding: 4px 11px; border-radius: 99px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .badge.agendada { background: var(--amber-soft); color: var(--amber); }
  .badge.gravada { background: var(--green-soft); color: var(--green); }
  .badge.cancelada { background: var(--surface-2); color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.topic { background: var(--accent-soft); border-color: rgba(187,208,237,.35); color: #DDE8F6; }
  .section-label { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 4px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .big { display: none; }
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }
  .person-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .avatar { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--disp); font-weight: 700; color: #fff; flex-shrink: 0; font-size: 17px; }
  .person-card .info { flex: 1; min-width: 0; }
  .person-card .nome { font-weight: 600; font-size: 15.5px; }
  .person-card .meta { color: var(--muted); font-size: 13px; word-break: break-word; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .person-card .acts { display: flex; gap: 6px; margin-top: 12px; }

  /* ---------- Janelas ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(8,9,11,.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; z-index: 60; overflow-y: auto; padding: 5vh 16px; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; width: 100%; max-width: 560px; padding: 24px; box-shadow: 0 18px 44px -14px rgba(0,0,0,.7); animation: pop .28s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal.wide { max-width: 800px; }
  .modal h2 { font-family: var(--disp); margin: 0 0 18px; font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .field { margin-bottom: 14px; }
  .field label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 120px; }
  .add-inline { display: flex; gap: 8px; }
  .add-inline input { flex: 1; }
  .people-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .people-pick label { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 7px 13px; cursor: pointer; font-size: 13.5px; min-height: 38px; }
  .people-pick label.checked { background: var(--accent-soft); border-color: var(--accent-2); color: #fff; }
  .people-pick input { display: none; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  a.link { color: var(--accent-text); cursor: pointer; text-decoration: none; font-size: 13px; }
  .topic-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border: 1px solid rgba(187,208,237,.35); border-radius: 99px; padding: 5px 6px 5px 12px; font-size: 13px; margin: 0 6px 6px 0; }
  .topic-tag button { background: rgba(255,255,255,.08); border: none; color: #DDE8F6; cursor: pointer; font-size: 12px; line-height: 1; width: 22px; height: 22px; border-radius: 99px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ---------- Celular ---------- */
  @media (max-width: 760px) {
    header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
    header .tabs { display: none; }
    .sync { margin-left: auto; }
    main { padding: 18px 16px 120px; }
    .bnav {
      display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); align-items: center;
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      height: 70px; padding: 0 4px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; z-index: 50; box-shadow: 0 14px 34px -12px rgba(0,0,0,.85);
    }
    .bnav .tab { flex-direction: column; gap: 3px; min-height: 58px; padding: 0 2px; border-radius: 16px; font-size: 11px; font-weight: 600; color: var(--muted); }
    .bnav .tab .ico { width: 22px; height: 22px; }
    .bnav .tab.active { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; }
    .bnav .rec { justify-self: center; width: 60px; height: 60px; margin-top: -30px; border-radius: 99px; border: 4px solid var(--bg); background: var(--rec); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(255,77,94,.9); }
    .bnav .rec .ico { width: 26px; height: 26px; }
    .bnav .rec:active { transform: scale(.95); }
    .cal-mes { font-size: 22px; }
    .cal-top .btn-nova { display: none; }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .card-actions { margin-left: 0; width: 100%; justify-content: flex-start; }
    input[type="search"] { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ===== Início em mapa mental (30/09/2026) ===== */
  .mm-wrap { position:relative; width:min(1320px, calc(100vw - 40px)); left:50%; transform:translateX(-50%); }
  .mm { position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(270px,310px) minmax(0,1fr); gap:0 56px; align-items:center; min-height:560px; padding:10px 0 20px; }
  .mm-linhas { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:0; }
  .mm-l { fill:none; stroke:#2B4166; stroke-width:2; transition:stroke .2s; }
  .mm-l.n1 { stroke:#3E5E8C; stroke-width:2.5; }
  .mm-f { fill:none; stroke:var(--accent-2); stroke-width:2; stroke-dasharray:3 22; opacity:0; transition:opacity .2s; }
  .mm-l.on { stroke:var(--accent); }
  .mm-f.on { opacity:1; animation:mmfluxo 1.2s linear infinite; filter:drop-shadow(0 0 4px rgba(153,185,222,.9)); }
  @keyframes mmfluxo { to { stroke-dashoffset:-25; } }
  .mm-col { position:relative; z-index:1; display:flex; flex-direction:column; gap:30px; min-width:0; }
  .mm-ramo { display:flex; align-items:center; gap:30px; }
  .mm-ramo.esq { flex-direction:row-reverse; }
  .mm-no { font-family:inherit; cursor:pointer; color:var(--text); transition:transform .18s var(--ease), border-color .18s, background .18s, box-shadow .18s; }
  .mm-no.n1 { display:flex; align-items:center; gap:12px; min-width:190px; padding:12px 14px; border-radius:18px; text-align:left;
    background:linear-gradient(160deg,#16264A,#0F1B33); border:1px solid #26395C; box-shadow:0 12px 26px -18px rgba(0,0,0,.9); }
  .mm-no.n1:hover { transform:translateY(-2px); border-color:rgba(153,185,222,.6); box-shadow:0 0 26px -10px rgba(153,185,222,.8); }
  .mm-ramo.aberto > .n1 { border-color:var(--accent); box-shadow:0 0 0 1px rgba(153,185,222,.35) inset, 0 0 26px -12px rgba(153,185,222,.9); }
  .mm-no.n1 .pl { width:42px; height:42px; flex:0 0 42px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:var(--accent); background:rgba(153,185,222,.12); border:1px solid rgba(153,185,222,.35); }
  .mm-ramo.aberto > .n1 .pl { background:var(--accent); color:var(--ink); }
  .mm-ic { width:20px; height:20px; } .mm-ic.s { width:15px; height:15px; }
  .mm-no.n1 .tx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .mm-no.n1 .tx b { font-family:var(--disp); font-size:17px; font-weight:700; }
  .mm-no.n1 .tx small { font-size:12px; color:var(--muted); }
  .mm-no.n1 .ch { width:18px; height:18px; color:var(--muted); transition:transform .25s var(--ease); }
  .mm-ramo.aberto > .n1 .ch { transform:rotate(90deg); color:var(--accent); }
  .mm-ramo.esq .n1 .ch { order:-1; transform:rotate(180deg); } .mm-ramo.esq.aberto .n1 .ch { transform:rotate(90deg); }
  .mm-folhas { display:flex; flex-direction:column; gap:8px; }
  .mm-ramo:not(.aberto) .mm-folhas { display:none; }
  .mm-ramo.aberto .mm-folhas > * { animation:mmsai .32s var(--ease) both; }
  .mm-ramo.aberto .mm-folhas > *:nth-child(2) { animation-delay:.04s; } .mm-ramo.aberto .mm-folhas > *:nth-child(3) { animation-delay:.08s; } .mm-ramo.aberto .mm-folhas > *:nth-child(4) { animation-delay:.12s; }
  @keyframes mmsai { from { opacity:0; transform:scale(.9) translateX(var(--mmdx,-10px)); } to { opacity:1; transform:none; } }
  .mm-ramo.esq .mm-folhas { --mmdx:10px; align-items:flex-end; }
  .mm-no.n2 { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border-radius:99px; font-size:13.5px; font-weight:500;

  .mm-anel { width:58px; height:58px; border-radius:50%; border:2px solid rgba(153,185,222,.5); display:flex; align-items:center; justify-content:center; margin-bottom:6px; animation:mmpulso 2.4s ease-in-out infinite; }

  @media (max-width:1260px){

  /* ===== Cortes ===== */

  /* ===== Animação dos botões da tela principal (30/09/2026) ===== */
  .mm-no, .mm-centro .btn { -webkit-tap-highlight-color: transparent; }

  <button class="tab" data-view="agenda"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>Gravações</button>

<main>
  <!-- ===== INÍCIO (menu) ===== -->
  <div id="view-home">
    <div class="mm-wrap" id="mapa"></div>
  </div>
  <div id="view-calendario" style="display:none">
    <div class="home-wrap" id="home-cal"></div>
  </div>

  <!-- ===== AGENDA ===== -->
  <div id="view-agenda" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button class="btn" onclick="openGravacao()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nova gravação</button>
      <input type="search" id="busca" placeholder="Buscar por título, tópico ou pessoa..." oninput="renderAgenda()">

        <option value="">Todos os status</option>
        <option value="agendada">Agendadas</option>
        <option value="gravada">Gravadas</option>
        <option value="cancelada">Canceladas</option>
      </select>
      <div style="margin-left:auto; display:flex; gap:8px;">

<!-- ===== MODAL CORTE ===== -->
<div class="overlay" id="overlayCorte">

    <h2 id="corteTitulo">Novo corte</h2>

    <div class="row">
      <div class="field" style="flex:2"><label>Mensagem de origem</label><input type="text" id="coMensagem" placeholder="Ex.: Estudo de quarta — interpretação bíblica"></div>
      <div class="field"><label>Pastor</label><input type="text" id="coPastor" placeholder="Ex.: Pr. Fulano"></div>
    </div>
    <div class="field"><label>Link do vídeo original</label><input type="url" id="coLink" placeholder="https://youtu.be/..."></div>
    <div class="row">
      <div class="field"><label>Início do trecho</label><input type="text" id="coInicio" placeholder="00:25:32"></div>

      <div class="field"><label>Status</label><select id="coStatus"><option value="afazer">A fazer</option><option value="edicao">Em edição</option><option value="pronto">Pronto</option><option value="postado">Postado</option></select></div>

      <button class="btn" onclick="salvarCorte()">Salvar corte</button>

<!-- ===== MODAL GRAVAÇÃO ===== -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nova gravação</h2>
    <input type="hidden" id="gId">

      <label>Título da gravação</label>
      <input type="text" id="gTitulo" placeholder="Ex: Episódio 12 — Entrevista">
    </div>

      <div class="field"><label>Data</label><input type="date" id="gData"></div>
      <div class="field"><label>Hora</label><input type="time" id="gHora"></div>
      <div class="field"><label>Status</label>
        <select id="gStatus">
          <option value="agendada">Agendada</option>
          <option value="gravada">Gravada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
    </div>

      <label>Tópicos de gravação</label>
      <div id="topicTags"></div>

      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="salvarGravacao()">Salvar</button>

  </div>
</div>

<!-- ===== MODAL PESSOA ===== -->

<!-- ===== MODAL ROTEIRO ===== -->

      <label>Título da gravação</label>
      <input id="rTitulo" type="text" placeholder="Ex.: PIB News — Programa 12">

      <label><svg class="ico-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 11l1.5-6L20 8.5 19 11M8.5 5.5l2 5M13.5 6.8l2 4"/></svg> Tema dos takes</label>

Exemplo:
• Abertura (00:00) — saudação e tema do dia
• Bloco 1 — ...
• Bloco 2 — ...
• Encerramento — chamada para próxima gravação" style="width:100%; line-height:1.6; resize:vertical;"></textarea>

      <button class="btn" onclick="salvarRoteiro()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg> Salvar roteiro</button>
    </div>
  </div>
</div>

<script>
const IC = {"cal": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/></svg>", "clap": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 11h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"/><path d=\"M4 11l1.5-6L20 8.5 19 11M8.5 5.5l2 5M13.5 6.8l2 4\"/></svg>", "pdf": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><path d=\"M14 3v6h6M12 12v6M9 15l3 3 3-3\"/></svg>", "words": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h16M4 18h10\"/></svg>", "phone": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"/></svg>", "check": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg>", "pen": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/></svg>", "doc": "<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><path d=\"M14 3v6h6M8 13h8M8 17h5\"/></svg>"};
const ICB = {"left": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg>", "right": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/></svg>", "plus": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>", "pen": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/></svg>", "pdf": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><path d=\"M14 3v6h6M12 12v6M9 15l3 3 3-3\"/></svg>", "doc": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><path d=\"M14 3v6h6M8 13h8M8 17h5\"/></svg>"};
let db = { gravacoes: [], pessoas: [], cortes: [] };
let draftTopics = [];
let accessCode = localStorage.getItem('cg-code') || '';

/* ---------- Sincronização com o servidor ---------- */
function authHeaders(extra) { return Object.assign({ 'x-access-code': accessCode }, extra || {}); }
function normalize(d) {
  return { gravacoes: Array.isArray(d && d.gravacoes) ? d.gravacoes : [],
           pessoas:   Array.isArray(d && d.pessoas)   ? d.pessoas   : [],
           cortes:    Array.isArray(d && d.cortes)    ? d.cortes    : [] };
}
function setSync(state) {
  const el = document.getElementById('sync');
  const map = {
    ok:        ['Sincronizado',   'var(--green)'],
    salvando:  ['Salvando…',       'var(--amber)'],
    erro:      ['Erro ao salvar',  'var(--red)'],
    off:       ['Sem conexão',     'var(--muted)'],
    bloqueado: ['Código necessário','var(--red)'],
    conectando:['Conectando…',     'var(--muted)']
  };
  const [txt, cor] = map[state] || map.conectando;
  el.textContent = txt; el.style.setProperty('--sync-cor', cor);
}
function pedirCodigo(msg) {
  const c = window.prompt(msg || 'Digite o código de acesso do app:');
  if (c === null) return false;
  accessCode = c.trim();
  localStorage.setItem('cg-code', accessCode);
  return true;
}

async function carregarDoServidor() {
  setSync('conectando');
  while (true) {
    let r;
    try { r = await fetch('/api/data', { headers: authHeaders() }); }
    catch (e) { setSync('off'); return false; }
    if (r.status === 401) {
      if (!pedirCodigo('Código incorreto ou necessário. Digite o código de acesso:')) { setSync('bloqueado'); return false; }
      continue;
    }
    if (!r.ok) { setSync('erro'); return false; }
    db = normalize(await r.json());
    setSync('ok');
    return true;
  }
}

let pushTimer = null, enviando = false, pendente = false;
function save() {
  pendente = true;
  setSync('salvando');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(enviarAoServidor, 600);
}
async function enviarAoServidor() {
  if (!pendente || enviando) return;
  enviando = true; pendente = false;
  try {
    const r = await fetch('/api/data', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(db)
    });
    setSync(r.ok ? 'ok' : 'erro');
  } catch (e) { setSync('off'); }
  enviando = false;
  if (pendente) enviarAoServidor();
}

async function sincronizarBaixar() {
  if (document.querySelector('.overlay.open')) return; // não atrapalha edição
  if (enviando || pendente) return;
  let r;
  try { r = await fetch('/api/data', { headers: authHeaders() }); }
  catch (e) { setSync('off'); return; }
  if (!r.ok) { return; }
  const novo = normalize(await r.json());
  if (JSON.stringify(novo) !== JSON.stringify(db)) {
    db = novo;
    renderTudo();
  }
  setSync('ok');
}
function renderTudo() { renderAgenda(); renderRoteiros(); renderPessoas(); renderCortes(); }
function uid() { return Date.now().toString(36) + Math.floor(performance.now()).toString(36) + (db.gravacoes.length+db.pessoas.length); }

/* ---------- Navegação ---------- */
function navegar(v) {
  ['home','calendario','agenda','roteiro','pessoas','cortes'].forEach(name => {
    const el = document.getElementById('view-'+name);
    if (el) el.style.display = (name===v) ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.view===v));
  if (v==='home') renderHome();
  if (v==='calendario') renderCal();
  if (v==='cortes') renderCortes();
  if (v==='pessoas') renderPessoas();
  if (v==='roteiro') renderRoteiros();
  if (v==='agenda') renderAgenda();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => navegar(t.dataset.view));

/* ---------- Pessoas ---------- */
const CORES = ['#6c8cff','#3ecf8e','#f5b942','#ff6b6b','#c084fc','#22d3ee','#fb7185','#a3e635'];
function iniciais(nome) {
  const partes = nome.trim().split(/\s+/);
  return ((partes[0]||'')[0] || '?').toUpperCase() + (partes.length>1 ? (partes[partes.length-1][0]||'').toUpperCase() : '');
}
function soDigitos(t){ return (t||'').replace(/\D/g,''); }
function waLink(tel){
  let d = soDigitos(tel);
  if (!d) return '';
  if (d.length <= 11 && !d.startsWith('55')) d = '55' + d;
  return 'https://wa.me/' + d;
}
function openPessoa(id) {
  const ov = document.getElementById('overlayPessoa');
  if (id) {
    const p = db.pessoas.find(x => x.id===id);
    document.getElementById('modalPessoaTitle').textContent = 'Editar pessoa';
    document.getElementById('pId').value = p.id;
    document.getElementById('pNome').value = p.nome;
    document.getElementById('pPapel').value = p.papel || '';
    document.getElementById('pCor').value = p.cor || '#6c8cff';
    document.getElementById('pTelefone').value = p.telefone || p.contato || '';
    document.getElementById('pNotas').value = p.notas || '';
    document.getElementById('btnExcluirPessoa').style.display = '';
  } else {
    document.getElementById('modalPessoaTitle').textContent = 'Nova pessoa';
    document.getElementById('pId').value = '';
    document.getElementById('pNome').value = '';
    document.getElementById('pPapel').value = '';
    document.getElementById('pCor').value = CORES[db.pessoas.length % CORES.length];
    document.getElementById('pTelefone').value = '';
    document.getElementById('pNotas').value = '';
    document.getElementById('btnExcluirPessoa').style.display = 'none';
  }
  ov.classList.add('open');
  setTimeout(() => document.getElementById('pNome').focus(), 50);
}
function closePessoa() { document.getElementById('overlayPessoa').classList.remove('open'); }
document.getElementById('overlayPessoa').addEventListener('click', e => { if (e.target.id==='overlayPessoa') closePessoa(); });

function salvarPessoa() {
  const nome = document.getElementById('pNome').value.trim();
  if (!nome) { alert('Digite o nome da pessoa.'); return; }
  const obj = {
    nome,
    papel: document.getElementById('pPapel').value.trim(),
    cor: document.getElementById('pCor').value,
    telefone: document.getElementById('pTelefone').value.trim(),
    notas: document.getElementById('pNotas').value.trim()
  };
  const id = document.getElementById('pId').value;
  if (id) { Object.assign(db.pessoas.find(x=>x.id===id), obj); }
  else { obj.id = uid(); db.pessoas.push(obj); }
  save(); closePessoa(); renderPessoas();
}
function excluirPessoa() {
  const id = document.getElementById('pId').value;
  const usados = db.gravacoes.filter(g => (g.pessoas||[]).includes(id)).length;
  let msg = 'Excluir esta pessoa?';
  if (usados) msg += `\nEla está marcada em ${usados} gravação(ões) — será removida delas também.`;
  if (!confirm(msg)) return;
  db.pessoas = db.pessoas.filter(p => p.id !== id);
  db.gravacoes.forEach(g => g.pessoas = (g.pessoas||[]).filter(pid => pid !== id));
  save(); closePessoa(); renderPessoas();
}
function renderPessoas() {
  const el = document.getElementById('lista-pessoas');
  const buscaEl = document.getElementById('buscaPessoa');
  const busca = (buscaEl ? buscaEl.value : '').toLowerCase();
  if (!db.pessoas.length) {
    el.innerHTML = '<div class="empty"><div class="big">👥</div>Nenhuma pessoa cadastrada.<br>Clique em <b>+ Nova pessoa</b> para começar.</div>';
    return;
  }
  let list = db.pessoas.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  if (busca) list = list.filter(p => (p.nome+' '+(p.papel||'')).toLowerCase().includes(busca));
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="big">🔍</div>Nenhuma pessoa encontrada.</div>'; return; }
  el.innerHTML = '<div class="people-grid">' + list.map(p => {
    const count = db.gravacoes.filter(g => (g.pessoas||[]).includes(p.id)).length;
    return `<div class="person-card">
      <div class="avatar" style="background:${p.cor}">${esc(iniciais(p.nome))}</div>
      <div class="info">
        <div class="nome">${esc(p.nome)}</div>
        ${p.papel?`<div class="meta">${esc(p.papel)}</div>`:''}
        ${(p.telefone||p.contato)?`<div class="meta">${IC.phone} <a class="link" href="tel:${esc(soDigitos(p.telefone||p.contato))}">${esc(p.telefone||p.contato)}</a> <a class="link" style="color:var(--green)" href="${waLink(p.telefone||p.contato)}" target="_blank" rel="noopener" title="Abrir no WhatsApp">WhatsApp ↗</a></div>`:''}
        <div class="meta">${IC.clap} ${count} gravação(ões)</div>
        <div class="acts">
          <button class="btn secondary small" onclick="openPessoa('${p.id}')">${ICB.pen} Editar</button>
        </div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

/* ---------- Tópicos (no modal) ---------- */
function addTopic() {
  const inp = document.getElementById('topicInput');
  const v = inp.value.trim();
  if (!v) return;
  draftTopics.push(v); inp.value = ''; renderTopicTags();
}
function removeTopic(i) { draftTopics.splice(i,1); renderTopicTags(); }
function renderTopicTags() {
  document.getElementById('topicTags').innerHTML = draftTopics.map((t,i) =>
    `<span class="topic-tag">${esc(t)} <button onclick="removeTopic(${i})">✕</button></span>`).join('');
}

/* ---------- Modal gravação ---------- */
function openGravacao(id, dataPre) {
  const ov = document.getElementById('overlay');
  const peoplePick = document.getElementById('peoplePick');
  peoplePick.innerHTML = db.pessoas.map(p =>
    `<label data-id="${p.id}"><input type="checkbox" value="${p.id}" onchange="this.parentElement.classList.toggle('checked', this.checked)"><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.cor}"></span>${esc(p.nome)}</label>`
  ).join('');
  document.getElementById('noPeopleHint').style.display = db.pessoas.length ? 'none' : '';

  if (id) {
    const g = db.gravacoes.find(x => x.id===id);
    document.getElementById('modalTitle').textContent = 'Editar gravação';
    document.getElementById('gId').value = g.id;
    document.getElementById('gTitulo').value = g.titulo;
    document.getElementById('gData').value = g.data || '';
    document.getElementById('gHora').value = g.hora || '';
    document.getElementById('gStatus').value = g.status;
    document.getElementById('gNotas').value = g.notas || '';
    draftTopics = [...(g.topicos||[])];
    (g.pessoas||[]).forEach(pid => {
      const cb = peoplePick.querySelector(`input[value="${pid}"]`);
      if (cb) { cb.checked = true; cb.parentElement.classList.add('checked'); }
    });
    document.getElementById('btnExcluir').style.display = '';
  } else {
    document.getElementById('modalTitle').textContent = 'Nova gravação';
    document.getElementById('gId').value = '';
    document.getElementById('gTitulo').value = '';
    document.getElementById('gData').value = dataPre || '';
    document.getElementById('gHora').value = '';
    document.getElementById('gStatus').value = 'agendada';
    document.getElementById('gNotas').value = '';
    draftTopics = [];
    document.getElementById('btnExcluir').style.display = 'none';
  }
  renderTopicTags();
  ov.classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeModal(); });

function salvarGravacao() {
  const titulo = document.getElementById('gTitulo').value.trim();
  if (!titulo) { alert('Digite o título da gravação.'); return; }
  const pessoas = [...document.querySelectorAll('#peoplePick input:checked')].map(c => c.value);
  const obj = {
    titulo,
    data: document.getElementById('gData').value,
    hora: document.getElementById('gHora').value,
    status: document.getElementById('gStatus').value,
    notas: document.getElementById('gNotas').value.trim(),
    topicos: [...draftTopics],
    pessoas
  };
  const id = document.getElementById('gId').value;
  if (id) { Object.assign(db.gravacoes.find(x=>x.id===id), obj); }
  else { obj.id = uid(); db.gravacoes.push(obj); }
  save(); closeModal(); renderAgenda();
}
function excluirGravacao() {
  const id = document.getElementById('gId').value;
  if (!confirm('Excluir esta gravação?')) return;
  db.gravacoes = db.gravacoes.filter(x => x.id !== id);
  save(); closeModal(); renderAgenda();
}

/* ---------- Roteiro ---------- */
function openRoteiro(id) {
  const g = db.gravacoes.find(x => x.id===id);
  if (!g) return;
  document.getElementById('rId').value = g.id;
  document.getElementById('rTitulo').value = g.titulo || '';
  document.getElementById('rTema').value = g.tema || '';
  document.getElementById('rTexto').value = g.roteiro || '';
  atualizaContadorRoteiro();
  document.getElementById('overlayRoteiro').classList.add('open');
  setTimeout(() => document.getElementById('rTexto').focus(), 50);
}
function novoRoteiro() {
  document.getElementById('rId').value = '';
  document.getElementById('rTitulo').value = '';
  document.getElementById('rTema').value = '';
  document.getElementById('rTexto').value = '';
  atualizaContadorRoteiro();
  document.getElementById('overlayRoteiro').classList.add('open');
  setTimeout(() => document.getElementById('rTitulo').focus(), 50);
}
function closeRoteiro() { document.getElementById('overlayRoteiro').classList.remove('open'); }
function salvarRoteiro() {
  const id = document.getElementById('rId').value;
  const titulo = document.getElementById('rTitulo').value.trim();
  if (!titulo) { alert('Dê um título para o roteiro.'); return; }
  const tema = document.getElementById('rTema').value;
  const texto = document.getElementById('rTexto').value;
  let g = id ? db.gravacoes.find(x => x.id===id) : null;
  if (g) {
    g.titulo = titulo; g.tema = tema; g.roteiro = texto;
  } else {
    g = { id: uid(), titulo, data: '', hora: '', status: 'agendada', notas: '', topicos: [], pessoas: [], tema, roteiro: texto };
    db.gravacoes.push(g);
  }
  save(); renderAgenda(); renderRoteiros();
  closeRoteiro();
}
function renderRoteiros() {
  const el = document.getElementById('lista-roteiros');
  if (!el) return;
  const busca = (document.getElementById('buscaRoteiro').value || '').toLowerCase();
  if (!db.gravacoes.length) {
    el.innerHTML = '<div class="empty"><div class="big">📝</div>Nenhuma gravação ainda.<br>Crie uma gravação na aba <b>Agenda</b> para escrever o roteiro dela.</div>';
    return;
  }
  const comRoteiro = db.gravacoes.filter(g => g.roteiro && g.roteiro.trim()).length;
  const feitas = db.gravacoes.filter(g => g.feita).length;
  const resumo = `<div class="roteiro-resumo"><span><b>${comRoteiro}</b> de ${db.gravacoes.length} com roteiro</span><span><b>${feitas}</b> feita(s) com sucesso</span></div>`;
  let list = db.gravacoes.slice().sort((a,b) => {
    if (!a.data && !b.data) return 0;
    if (!a.data) return 1;
    if (!b.data) return -1;
    return (a.data+a.hora).localeCompare(b.data+b.hora);
  });
  if (busca) list = list.filter(g => g.titulo.toLowerCase().includes(busca));
  if (!list.length) { el.innerHTML = resumo + '<div class="empty"><div class="big">🔍</div>Nenhuma gravação encontrada.</div>'; return; }
  el.innerHTML = resumo + list.map(g => {
    const txt = (g.roteiro || '').trim();
    const tem = !!txt;
    const palavras = tem ? txt.split(/\s+/).length : 0;
    const preview = tem ? esc(txt.slice(0,220)) + (txt.length>220?'…':'') : '';
    return `<div class="card roteiro${tem?'':' vazio'}${g.feita?' feita':''}">
      <div class="card-head">
        <div style="flex:1; min-width:0;">
          <div class="title">${esc(g.titulo)}</div>
          <div class="when">${IC.cal} ${fmtData(g.data,g.hora)}</div>
        </div>
        <div class="card-actions">
          ${tem
            ? '<span class="badge gravada">Roteiro pronto</span>'
            : '<span class="badge agendada">A escrever</span>'}
          <button class="btn small" onclick="openRoteiro('${g.id}')">${ICB.pen} ${tem?'Abrir / editar':'Escrever'}</button>
          ${tem?`<button class="btn small secondary" onclick="gerarPdfRoteiro('${g.id}')">${ICB.pdf} PDF</button>`:''}
        </div>
      </div>
      ${tem
        ? `<div class="roteiro-preview">${preview}</div><div class="roteiro-meta">${g.tema&&g.tema.trim()?`<span>${IC.clap} ${esc(g.tema.trim().slice(0,70))}${g.tema.trim().length>70?'…':''}</span>`:''}<span>${IC.words} ${palavras} palavra(s)</span><span>${txt.length} caracteres</span></div>`
        : '<div class="roteiro-preview" style="font-style:italic;">Ainda sem texto — clique em “Escrever” para começar.</div>'}
      <div><label class="check-feita"><input type="checkbox" ${g.feita?'checked':''} onclick="toggleFeita('${g.id}', this.checked)"> Gravação feita com sucesso</label></div>
    </div>`;
  }).join('');
}
function atualizaContadorRoteiro() {
  document.getElementById('rContador').textContent = document.getElementById('rTexto').value.length;
}
function toggleFeita(id, val) {
  const g = db.gravacoes.find(x => x.id===id);
  if (!g) return;
  g.feita = val;
  if (val) g.status = 'gravada';
  else if (g.status === 'gravada') g.status = 'agendada';
  save();
  renderRoteiros();
  renderAgenda();
}
/* ---------- PDF do roteiro (formato PIB News) ---------- */
function pdfSafe(s){
  return (s||'')
    .replace(/[–—]/g,'-')
    .replace(/[‘’]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/…/g,'...')
    .replace(/[•●▪]/g,'-')
    .replace(/[^\S\r\n]/g,' ');
}
function gerarPdfRoteiro(id, fromModal){
  const g = db.gravacoes.find(x => x.id===id);
  if (!g) { alert('Gravação não encontrada.'); return; }
  const tema = fromModal ? document.getElementById('rTema').value : (g.tema || '');
  const roteiro = fromModal ? document.getElementById('rTexto').value : (g.roteiro || '');
  if (!roteiro.trim()) { alert('Escreva o roteiro antes de gerar o PDF.'); return; }
  if (!window.jspdf || !window.jspdf.jsPDF) { alert('O gerador de PDF ainda está carregando. Tente de novo em 1-2 segundos.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 50;
  let y = 62;
  const linhas = roteiro.replace(/\r/g,'').split('\n');
  let i = 0; while (i < linhas.length && !linhas[i].trim()) i++;
  const titulo = pdfSafe((linhas[i] || 'ROTEIRO PIB NEWS').trim()); i++;
  // Título
  doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(40,22,95);
  doc.text(titulo.toUpperCase(), W/2, y, { align:'center' }); y += 8;
  doc.setDrawColor(150,110,225); doc.setLineWidth(2.2); doc.line(M, y+4, W-M, y+4); y += 28;
  // Tema dos takes
  if (tema && tema.trim()) {
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(120,70,205);
    const tl = doc.splitTextToSize('Tema dos takes: ' + pdfSafe(tema.trim()), W-2*M);
    tl.forEach(w => { if (y > H-50) { doc.addPage(); y = 62; } doc.text(w, M, y); y += 16; });
    y += 8;
  }
  // Corpo (com TAKES em destaque)
  const lh = 15.5;
  for (; i < linhas.length; i++) {
    const ln = pdfSafe(linhas[i]);
    const ehTake = /^\s*TAKE\b/i.test(ln);
    doc.setFont('helvetica', ehTake ? 'bold' : 'normal');
    doc.setFontSize(ehTake ? 12 : 11);
    if (ehTake) { doc.setTextColor(40,22,95); y += 4; } else doc.setTextColor(35,35,35);
    const wrapped = doc.splitTextToSize(ln.length ? ln : ' ', W-2*M);
    for (const w of wrapped) { if (y > H-50) { doc.addPage(); y = 62; } doc.text(w, M, y); y += lh; }
  }
  const safe = (g.titulo || 'PIB News').replace(/[\\/:*?"<>|]+/g,'-').trim();
  doc.save('Roteiro - ' + safe + '.pdf');
}

function renderStats() {

function fmtData(d, h) {
  if (!d) return 'Sem data definida';
  const [y,m,day] = d.split('-');
  const dias = ['dom','seg','ter','qua','qui','sex','sáb'];
  const dt = new Date(d+'T00:00:00');
  let s = `${dias[dt.getDay()]}, ${day}/${m}/${y}`;
  if (h) s += ` às ${h}`;
  return s;
}

function homeNav(delta){
  if (homeAno == null) homeHoje();

  if (homeMes < 0) { homeMes = 11; homeAno--; }
  if (homeMes > 11) { homeMes = 0; homeAno++; }

function renderCal(){
  const el = document.getElementById('home-cal'); if (!el) return;
  if (homeAno == null) { const d = new Date(); homeAno = d.getFullYear(); homeMes = d.getMonth(); }
  const offset = new Date(homeAno, homeMes, 1).getDay();
  const nd = new Date(homeAno, homeMes + 1, 0).getDate();
  const hojeISO = new Date().toISOString().slice(0,10);
  const porData = {};
  db.gravacoes.forEach(g => { if (g.data) (porData[g.data] = porData[g.data] || []).push(g); });
  Object.values(porData).forEach(arr => arr.sort((a,b) => (a.hora||'').localeCompare(b.hora||'')));
  const head = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x => `<div>${x}</div>`).join('');

  for (let d = 1; d <= nd; d++) {

      <button class="btn btn-nova" style="margin-left:auto" onclick="openGravacao()">${ICB.plus} Nova gravação</button>

function desenharMapa(){
  const mm = document.getElementById('mm'), svg = document.getElementById('mmLinhas'), c = document.getElementById('mmCentro');
  if (!mm || !svg || !c || !mm.offsetParent) return;
  const B = mm.getBoundingClientRect();
  svg.setAttribute('width', B.width); svg.setAttribute('height', B.height); svg.setAttribute('viewBox', `0 0 ${B.width} ${B.height}`);
  const R = e => { const r = e.getBoundingClientRect(); return { l:r.left-B.left, r:r.right-B.left, t:r.top-B.top, b:r.bottom-B.top, cx:(r.left+r.right)/2-B.left, cy:(r.top+r.bottom)/2-B.top }; };
  const C = R(c); let out = '';
  const curva = (x1,y1,x2,y2) => { const k=(x2-x1)*0.5; return `M${x1.toFixed(1)} ${y1.toFixed(1)}C${(x1+k).toFixed(1)} ${y1.toFixed(1)} ${(x2-k).toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const cotovelo = (x,y1,x2,y2) => `M${x.toFixed(1)} ${y1.toFixed(1)}V${(y2-10).toFixed(1)}Q${x.toFixed(1)} ${y2.toFixed(1)} ${(x+10).toFixed(1)} ${y2.toFixed(1)}H${x2.toFixed(1)}`;
  const linha = (d, rid, n) => `<path class="mm-l n${n}" data-r="${rid}" d="${d}"/><path class="mm-f n${n}" data-r="${rid}" d="${d}"/>`;
  const cel = mmCelular();
  mm.querySelectorAll('.mm-ramo').forEach(r => {
    const rid = r.dataset.ramo, n1 = R(r.querySelector('[data-n1]'));
    if (cel) out += linha(cotovelo(C.l+22, C.b, n1.l, n1.cy), rid, 1);
    else if (r.classList.contains('esq')) out += linha(curva(C.l, C.cy, n1.r, n1.cy), rid, 1);
    else out += linha(curva(C.r, C.cy, n1.l, n1.cy), rid, 1);
    if (!r.classList.contains('aberto')) return;
    r.querySelectorAll('[data-folha]').forEach(f => {
      const L = R(f);
      if (cel) out += linha(cotovelo(n1.l+22, n1.b, L.l, L.cy), rid, 2);
      else if (r.classList.contains('esq')) out += linha(curva(n1.l, n1.cy, L.r, L.cy), rid, 2);
      else out += linha(curva(n1.r, n1.cy, L.l, L.cy), rid, 2);
    });
  });
  svg.innerHTML = out;
}
window.addEventListener('resize', () => { clearTimeout(window._mmT); window._mmT = setTimeout(desenharMapa, 80); });

/* toque no celular: marca o botão por um instante pra pessoa ver que foi selecionado */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  const b = e.target.closest('.mm-no, .mm-centro .btn'); if (!b) return;
  b.classList.add('tocado'); setTimeout(() => b.classList.remove('tocado'), 280);
});

/* ---------- Backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gravacoes-backup.json';
  a.click();
}
function importData(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.gravacoes || !d.pessoas) throw 0;
      if (!confirm('Isso vai SUBSTITUIR todos os dados (inclusive os da outra pessoa) pelos do arquivo. Continuar?')) return;
      db = normalize(d); save(); renderTudo();
      alert('Dados importados com sucesso!');
    } catch(e){ alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Init ---------- */
(async function boot() {
  const ok = await carregarDoServidor();
  renderTudo();
  if (ok) setInterval(sincronizarBaixar, 7000);
})();
</script>
