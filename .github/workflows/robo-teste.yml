# Teste do robô de cortes: roda o caminho todo com um vídeo conhecido, sem gravar no app e sem publicar.
name: robo-teste
on:
  push:
    branches: [robo-cortes]
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checar a pasta do Drive
        run: python robo/verificar.py
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U -r robo/requirements.txt && python -c "import av,faster_whisper;print(av.__version__,faster_whisper.__version__)"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-medium-v1
      - name: Rodar o robô em modo teste
        env:
          TESTE_VIDEO_URL: https://github.com/rthurcout-cloud/PIBNEWS-APP/releases/download/culto-2026-09-27-noite/mensagem-2026-09-27-noite-1080p.mp4
          TESTE_PLANO: '{"cortes":[{"titulo":"Quem esta no amanha","inicio":"00:04:18","fim":"00:05:12"},{"titulo":"Nada limita Deus","inicio":"00:07:27","fim":"00:08:32"}],"correcoes":{"libres":"livres"}}'
        run: python robo/processar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-teste
          path: |
            trabalho/cortes/*.mp4
            trabalho/transcricao.txt
          retention-days: 7
